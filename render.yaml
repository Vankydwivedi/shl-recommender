services:
  - type: web
    name: shl-recommender
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_API_KEY
        sync: false   # set manually in Render dashboard
      - key: LLM_PROVIDER
        value: google
    healthCheckPath: /health
    plan: free
